<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Autobahn Warehouse — Scan</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172336;font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:560px;margin:auto;padding:24px 16px}h1{font-size:24px;margin:8px 0 4px}.sub{color:#64748b;margin:0 0 20px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 20px #182b4012}button{border:0;border-radius:10px;background:#1766d1;color:white;padding:14px;font-size:16px;font-weight:700;width:100%;margin:12px 0 0}button:disabled{opacity:.55}.secondary{background:#4b5563}#reader{margin-top:16px;overflow:hidden;border-radius:12px}#reader video{border-radius:12px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 6px}input{width:100%;padding:12px;font:16px system-ui;border:1px solid #cbd5e1;border-radius:9px}.status{margin:14px 0 0;white-space:pre-wrap;color:#475569}.tip{font-size:13px;color:#64748b;margin-top:18px}</style></head>
<body><main class="wrap"><h1>Autobahn Warehouse</h1><p class="sub">Scan Part — Code 128</p><section class="card"><button id="start">Start Camera</button><button id="stop" class="secondary" disabled>Stop Camera</button><div id="reader"></div><label for="sku">Or enter SKU manually</label><input id="sku" placeholder="MER-PRT-0006" autocomplete="off" autocapitalize="characters"><button id="find">Find Part</button><p class="status" id="status" role="status">Open this page in Safari and tap Start Camera.</p></section><p class="tip">Camera access requires Safari permission. The barcode is processed on your phone; the SKU is sent to your existing Autobahn Warehouse lookup page.</p></main>
<script>
const BASE='https://script.google.com/macros/s/AKfycbwC_TNf-sxMgQmzoYaSV_bsiLGwShCJooDhP3ukIYY4DimCV8-gmvboqYRfkaRNAFMX/exec';
const statusEl=document.getElementById('status'),startBtn=document.getElementById('start'),stopBtn=document.getElementById('stop'),input=document.getElementById('sku');
let scanner=null,starting=false,redirecting=false;
function status(s){statusEl.textContent=s;}
  function openPart(value){if(redirecting)return;const sku=String(value||'').trim().toUpperCase();if(!sku)return status('Enter a SKU first.');if(!/^[A-Z0-9_-]{2,80}$/.test(sku))return status('Invalid SKU: '+sku);redirecting=true;status('Found '+sku+' — opening part...');window.location.assign(BASE+'?page=scan&sku='+encodeURIComponent(sku));
async function start(){if(starting||scanner)return;if(typeof Html5Qrcode==='undefined')return status('Scanner library did not load. Check your internet connection.');starting=true;startBtn.disabled=true;status('Requesting camera access...');try{scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128],verbose:false});await scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.min(Math.floor(w*.9),360),height:Math.min(Math.floor(h*.5),140)}),aspectRatio:1.777778},decoded=>openPart(decoded),()=>{});stopBtn.disabled=false;status('Point the camera at the printed barcode.');}catch(e){status('Cannot open camera: '+(e?.message||String(e))+'\nOpen this page directly in Safari and allow camera access.');scanner=null;startBtn.disabled=false;}finally{starting=false;}}
async function stop(){if(!scanner)return;stopBtn.disabled=true;try{await scanner.stop();scanner.clear();}catch(e){}scanner=null;startBtn.disabled=false;status('Camera stopped.');}
startBtn.addEventListener('click',start);stopBtn.addEventListener('click',stop);document.getElementById('find').addEventListener('click',()=>openPart(input.value));input.addEventListener('keydown',e=>{if(e.key==='Enter')openPart(input.value)});
</script></body></html>
